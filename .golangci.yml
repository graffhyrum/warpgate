version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - prealloc
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: var-naming

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
